services:
  mariadb-lab-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mariadb-lab-1
    hostname: mariadb-lab-1
    volumes:
      - mariadb_lab_1_data:/data/mysql/data
      - mariadb_lab_1_logs:/data/mysql/logs
      - mariadb_lab_1_binlog:/data/mysql/binlog
      - mariadb_lab_1_relaylog:/data/mysql/relaylog
      - ./config/mariadb-lab-1/my.cnf:/data/mysql/config/my.cnf:ro
    ports:
      - "33061:3306"
    networks:
      mysql_net:
        ipv4_address: 172.18.0.201
    restart: unless-stopped

  mariadb-lab-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mariadb-lab-2
    hostname: mariadb-lab-2
    volumes:
      - mariadb_lab_2_data:/data/mysql/data
      - mariadb_lab_2_logs:/data/mysql/logs
      - mariadb_lab_2_binlog:/data/mysql/binlog
      - mariadb_lab_2_relaylog:/data/mysql/relaylog
      - ./config/mariadb-lab-2/my.cnf:/data/mysql/config/my.cnf:ro
    ports:
      - "33062:3306"
    networks:
      mysql_net:
        ipv4_address: 172.18.0.202
    restart: unless-stopped

  mariadb-lab-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mariadb-lab-3
    hostname: mariadb-lab-3
    volumes:
      - mariadb_lab_3_data:/data/mysql/data
      - mariadb_lab_3_logs:/data/mysql/logs
      - mariadb_lab_3_binlog:/data/mysql/binlog
      - mariadb_lab_3_relaylog:/data/mysql/relaylog
      - ./config/mariadb-lab-3/my.cnf:/data/mysql/config/my.cnf:ro
    ports:
      - "33063:3306"
    networks:
      mysql_net:
        ipv4_address: 172.18.0.203
    restart: unless-stopped

volumes:
  mariadb_lab_1_data:
    name: mariadb_lab_1_data
  mariadb_lab_1_logs:
    name: mariadb_lab_1_logs
  mariadb_lab_1_binlog:
    name: mariadb_lab_1_binlog
  mariadb_lab_1_relaylog:
    name: mariadb_lab_1_relaylog
  mariadb_lab_2_data:
    name: mariadb_lab_2_data
  mariadb_lab_2_logs:
    name: mariadb_lab_2_logs
  mariadb_lab_2_binlog:
    name: mariadb_lab_2_binlog
  mariadb_lab_2_relaylog:
    name: mariadb_lab_2_relaylog
  mariadb_lab_3_data:
    name: mariadb_lab_3_data
  mariadb_lab_3_logs:
    name: mariadb_lab_3_logs
  mariadb_lab_3_binlog:
    name: mariadb_lab_3_binlog
  mariadb_lab_3_relaylog:
    name: mariadb_lab_3_relaylog

networks:
  mysql_net:
    name: mysql_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
